name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # Align with local dev (npm 11+). Node 20 + npm ci often fails when
          # package-lock.json was generated on macOS (sharp / @emnapi optional deps).
          node-version: "22"
          cache: npm

      # npm install (not npm ci): lockfile from Mac may omit Linux-only optional
      # packages that sharp needs on ubuntu-latest. Other agents often use
      # `npm install` locally without committing an updated lock — CI then breaks.
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run test

      - run: npm run lint

      # NOTE: `next build` is intentionally NOT run here. The build hits Postgres
      # (Payload generateStaticParams + SSG pages) which CI has no access to.
      # Vercel owns the real build/deploy with DATABASE_URI configured.
