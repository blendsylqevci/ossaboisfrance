name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Align with local dev (npm 11+). Node 20 + npm ci often fails when
          # package-lock.json was generated on macOS (sharp / @emnapi optional deps).
          node-version: "22"
          cache: npm

      # npm install (not npm ci): lockfile from Mac may omit Linux-only optional
      # packages that sharp needs on ubuntu-latest. Other agents often use
      # `npm install` locally without committing an updated lock — CI then breaks.
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run test

      - run: npm run lint

      - run: npm run build
        env:
          PAYLOAD_SECRET: ci-build-secret-min-32-chars-long
          DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci
          S3_BUCKET: media
          S3_ACCESS_KEY_ID: ci
          S3_SECRET_ACCESS_KEY: ci
          S3_REGION: eu-central-1
          S3_ENDPOINT: https://example.com
